services:
  - type: web
    name: techflow-estoque
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: PROXY_HOPS               # o Render põe 1 proxy na frente do app (IP real no login/auditoria)
        value: "1"
      - key: TZ                       # datas do SQLite ('localtime') saem no horário de Brasília, não em UTC
        value: America/Sao_Paulo
      - key: DATABASE_PATH
        value: /var/data/techflow.db   # exige um Disk persistente montado em /var/data
