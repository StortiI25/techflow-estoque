{% extends 'base.html' %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block content %}
<div class="{{ '' if usuario_logado else 'auth-wrap' }}">
  <div class="{{ 'card-tf' if usuario_logado else 'auth-card' }} text-center" style="{{ 'max-width:560px;margin:3rem auto' if usuario_logado }}">
    <div class="display-3 fw-bold text-primary mb-2">{{ codigo }}</div>
    <h1 class="h4">{{ titulo }}</h1>
    <p class="text-muted">{{ mensagem }}</p>
    <a class="btn btn-primary" href="{{ url_for('dashboard.index') if usuario_logado else url_for('auth.login') }}"><i class="bi bi-house-door me-1"></i>{{ 'Voltar ao início' if usuario_logado else 'Ir para o login' }}</a>
  </div>
</div>
{% endblock %}
